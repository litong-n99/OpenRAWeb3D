<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenRAWeb3D</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    /* @font-face — OpenRA game fonts (TODO-27.D.4) */
    @font-face {
      font-family: 'OpenRA Sans';
      src: url('/fonts/FreeSans.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'OpenRA Sans';
      src: url('/fonts/FreeSansBold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'OpenRA Title';
      src: url('/fonts/ZoodRangmah.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ---- ChromeMetrics CSS fallback ---- */
    /* ChromeMetrics.get() probes CSS custom properties as a fallback when
       no metrics YAML has been loaded. These defaults keep the Widget
       system functional during development without MIX assets. */
    :root {
      --DefaultCursor: default;
      --ButtonDepth: 2px;
      --FontSize: 14px;
      --Color: #e0e0e0;
    }

    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'OpenRA Sans', system-ui, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Canvas (layout — paint/vendor rules in src/style.css) */
    #game-canvas {
      width: 100%;
      height: 100vh;
    }

    /* Mod Selector Container */
    #mod-selector {
      min-height: 100vh;
      padding: 2rem;
    }

    /* Mod Selector Header */
    .mod-selector-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .mod-selector-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #f0f0f0;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }
    .mod-selector-header p {
      font-size: 1.1rem;
      color: #8888aa;
    }

    /* Mod Card Grid */
    .mod-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Mod Card */
    .mod-card {
      background: linear-gradient(135deg, #1e1e3a 0%, #252545 100%);
      border: 1px solid #333355;
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .mod-card:hover {
      transform: translateY(-3px);
      border-color: #5555aa;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .mod-card.unavailable {
      opacity: 0.5;
    }
    .mod-card.unavailable:hover {
      transform: none;
      border-color: #333355;
      box-shadow: none;
    }

    /* Coming Soon Ribbon */
    .mod-card-ribbon {
      position: absolute;
      top: 12px;
      right: -30px;
      background: #cc8800;
      color: #1a1a2e;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 36px;
      transform: rotate(45deg);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Mod Card Elements */
    .mod-card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f0f0f0;
      margin: 0;
    }
    .mod-card-version {
      font-size: 0.8rem;
      color: #6666aa;
    }
    .mod-card-description {
      font-size: 0.9rem;
      color: #aaaacc;
      line-height: 1.5;
      flex-grow: 1;
    }

    /* Faction Tags */
    .mod-card-factions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .mod-card-faction-tag {
      background: rgba(120, 120, 200, 0.2);
      border: 1px solid rgba(120, 120, 200, 0.4);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      color: #aaaadd;
    }

    /* Play Button */
    .mod-card-play-btn {
      background: #4466cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 0.5rem;
    }
    .mod-card-play-btn:hover {
      background: #5577dd;
    }
    .mod-card-play-btn:focus-visible {
      outline: 2px solid #88aaff;
      outline-offset: 2px;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 1000;
    }
    .loading-content {
      text-align: center;
      max-width: 400px;
      width: 80%;
    }
    #loading-bar-container {
      width: 100%;
      height: 6px;
      background: #2a2a4e;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    #loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4466cc, #6688ee);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    #loading-text {
      color: #aaaaee;
      font-size: 0.9rem;
    }

    /* Empty / Error States */
    .mod-selector-empty,
    .mod-selector-error {
      text-align: center;
      padding: 4rem 1rem;
    }
    .mod-selector-empty h1,
    .mod-selector-error h1 {
      font-size: 1.5rem;
      color: #ccccee;
      margin-bottom: 0.5rem;
    }
    .mod-selector-empty p,
    .mod-selector-error p {
      color: #8888aa;
    }
    .mod-selector-error h1 {
      color: #ee8888;
    }
    .mod-selector-empty code,
    .mod-selector-error code {
      background: #2a2a4e;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: ui-monospace, Consolas, monospace;
      color: #aaaadd;
    }
  </style>
</head>
<body>
  <div id="mod-selector"></div>
  <canvas id="game-canvas" style="display:none"></canvas>
  <div id="loading-overlay" style="display:none">
    <div class="loading-content">
      <div id="loading-bar-container"><div id="loading-bar"></div></div>
      <span id="loading-text">Loading...</span>
    </div>
  </div>
  <script>
    // Ensure custom fonts are loaded before showing any UI text.
    // font-display:swap means fallback fonts are shown immediately, but
    // layout shifts can still occur. document.fonts.ready resolves when
    // all @font-face fonts have finished loading (or failed).
    // We attach a class to <html> so CSS can gate font-dependent styling.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        document.documentElement.classList.add('fonts-loaded')
      })
    } else {
      // Fallback for browsers without Font Loading API
      document.documentElement.classList.add('fonts-loaded')
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
