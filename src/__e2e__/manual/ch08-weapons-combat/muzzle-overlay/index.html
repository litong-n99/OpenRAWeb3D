<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzzle Overlay — Weapon Hardpoint Flash | Acceptance Test</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui; background: #1a1a2e; color: #eee; }
    #header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; }
    #header h1 { margin: 0; font-size: 20px; }
    #header .subtitle { color: #a0a0b0; font-size: 13px; margin-top: 4px; }
    #layout { display: flex; height: calc(100vh - 155px); }
    #sandbox { flex: 1; position: relative; }
    #sandbox canvas { display: block; width: 100%; height: 100%; }
    #sidebar { width: 285px; padding: 14px; background: #16213e; overflow-y: auto; font-size: 12px; border-left: 1px solid #0f3460; }
    #sidebar h3 { margin: 8px 0 4px; font-size: 13px; color: #7ec8e3; }
    #sidebar .diag-row { display: flex; justify-content: space-between; padding: 2px 0; }
    #sidebar .diag-row .val { color: #ffd966; font-family: monospace; }
    #controls { padding: 10px 24px; background: #16213e; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #controls button { padding: 6px 14px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 13px; cursor: pointer; }
    #controls button:hover { background: #0f3460; }
    #controls label { font-size: 12px; color: #a0a0b0; }
    #controls select, #controls input { padding: 4px 8px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 12px; }
    #info-bar { padding: 6px 24px; background: #0f0f1a; font-size: 11px; color: #666; display: flex; gap: 24px; }
    #info-bar span { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="header">
    <h1>P0B.2 Muzzle Overlay — Weapon Hardpoint Flash</h1>
    <div class="subtitle">Module: WithMuzzleOverlay | Dual/Single Barrel | Billboard flash at hardpoint</div>
  </div>
  <div id="controls">
    <button id="btnFire">Fire Weapon</button>
    <button id="btnFireS0">Slot 0</button>
    <button id="btnFireS1">Slot 1</button>
    <label>Mode: <select id="selMode"><option value="dual">Dual (alt)</option><option value="single">Single</option></select></label>
    <label>Dur: <input id="sldDur" type="range" min="2" max="20" value="6" style="width:70px"> <span id="valDur">6t</span></label>
    <label>Size: <input id="sldSize" type="range" min="15" max="80" value="40" style="width:70px"> <span id="valSize">0.40</span>wu</label>
    <button id="btnReset">Reset</button>
  </div>
  <div id="layout">
    <div id="sandbox"><canvas id="renderCanvas"></canvas></div>
    <div id="sidebar">
      <h3>Turret</h3>
      <div class="diag-row"><span>Mode</span><span class="val" id="diagMode">dual</span></div>
      <div class="diag-row"><span>Next Slot</span><span class="val" id="diagNext">0</span></div>
      <div class="diag-row"><span>Fires</span><span class="val" id="diagFires">0</span></div>
      <h3>Slot 0</h3>
      <div class="diag-row"><span>Visible</span><span class="val" id="diagS0vis">-</span></div>
      <div class="diag-row"><span>Remaining</span><span class="val" id="diagS0rem">-</span></div>
      <h3>Slot 1</h3>
      <div class="diag-row"><span>Visible</span><span class="val" id="diagS1vis">-</span></div>
      <div class="diag-row"><span>Remaining</span><span class="val" id="diagS1rem">-</span></div>
      <h3>Check</h3>
      <div class="diag-row"><span>Billboard dot</span><span class="val" id="diagDot">-</span></div>
    </div>
  </div>
  <div id="info-bar">
    <span>UA: <span id="info-ua">-</span></span>
    <span>VP: <span id="info-viewport">-</span></span>
    <span>Engine: <span id="info-engine">-</span></span>
    <span>FPS: <span id="info-fps">-</span></span>
    <span>T: <span id="info-time">-</span></span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
