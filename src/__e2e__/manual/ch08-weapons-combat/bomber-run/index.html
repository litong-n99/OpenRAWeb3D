<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomber Run — Aircraft Bombing | Acceptance Test</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui; background: #1a1a2e; color: #eee; }
    #header { padding: 14px 24px; background: #16213e; border-bottom: 1px solid #0f3460; }
    #header h1 { margin: 0; font-size: 19px; } #header .sub { color: #a0a0b0; font-size: 12px; margin-top: 3px; }
    #layout { display: flex; height: calc(100vh - 145px); }
    #sandbox { flex: 1; position: relative; } #sandbox canvas { display: block; width: 100%; height: 100%; }
    #sidebar { width: 250px; padding: 12px; background: #16213e; overflow-y: auto; font-size: 12px; border-left: 1px solid #0f3460; }
    #sidebar h3 { margin: 8px 0 4px; font-size: 13px; color: #7ec8e3; }
    #sidebar .r { display: flex; justify-content: space-between; padding: 2px 0; }
    #sidebar .r .v { color: #ffd966; font-family: monospace; }
    #controls { padding: 10px 24px; background: #16213e; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #controls button { padding: 6px 14px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 13px; cursor: pointer; }
    #controls button:hover { background: #0f3460; }
    #controls label { font-size: 12px; color: #a0a0b0; }
    #controls input { padding: 4px 8px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 12px; }
    #info-bar { padding: 6px 24px; background: #0f0f1a; font-size: 11px; color: #666; display: flex; gap: 24px; }
  </style>
</head>
<body>
  <div id="header"><h1>P2B.1 Bomber Run — Aircraft Bombing</h1><div class="sub">Module: AttackBomber + Aircraft | Straight-line pass, bomb drop, return to base</div></div>
  <div id="controls">
    <button id="btnStart">Start Bomber Run</button>
    <label>Speed: <input id="sldSpeed" type="range" min="100" max="800" value="400" style="width:70px"> <span id="valSpeed">400</span>su/t</label>
    <label>Interval: <input id="sldInterval" type="range" min="5" max="30" value="12" style="width:70px"> <span id="valInterval">12</span>t</label>
    <label>Bombs: <input id="sldCount" type="range" min="1" max="8" value="4" style="width:70px"> <span id="valCount">4</span></label>
    <button id="btnReset">Reset</button>
  </div>
  <div id="layout">
    <div id="sandbox"><canvas id="renderCanvas"></canvas></div>
    <div id="sidebar">
      <h3>Aircraft</h3><div class="r"><span>Position</span><span class="v" id="dPos">-</span></div><div class="r"><span>Altitude</span><span class="v" id="dAlt">-</span></div><div class="r"><span>Phase</span><span class="v" id="dPhase">idle</span></div>
      <h3>Bombs</h3><div class="r"><span>Dropped</span><span class="v" id="dDropped">0</span></div><div class="r"><span>Active</span><span class="v" id="dActive">0</span></div><div class="r"><span>Detonated</span><span class="v" id="dDet">0</span></div>
      <h3>Run</h3><div class="r"><span>Complete</span><span class="v" id="dComplete">no</span></div><div class="r"><span>Run Count</span><span class="v" id="dRuns">0</span></div>
    </div>
  </div>
  <div id="info-bar">
    <span>UA: <span id="info-ua">-</span></span><span>VP: <span id="info-viewport">-</span></span><span>Engine: <span id="info-engine">-</span></span><span>FPS: <span id="info-fps">-</span></span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
