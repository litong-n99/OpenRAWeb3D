<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warhead Impact Gallery | Acceptance Test</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui; background: #1a1a2e; color: #eee; }
    #flashOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; z-index: 99; transition: none; }
    #header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; position: relative; z-index: 1; }
    #header h1 { margin: 0; font-size: 20px; }
    #header .subtitle { color: #a0a0b0; font-size: 13px; margin-top: 4px; }
    #layout { display: flex; height: calc(100vh - 155px); position: relative; z-index: 1; }
    #sandbox { flex: 1; position: relative; }
    #sandbox canvas { display: block; width: 100%; height: 100%; }
    #sidebar { width: 250px; padding: 14px; background: #16213e; overflow-y: auto; font-size: 12px; border-left: 1px solid #0f3460; }
    #sidebar h3 { margin: 8px 0 4px; font-size: 13px; color: #7ec8e3; }
    #sidebar .diag-row { display: flex; justify-content: space-between; padding: 2px 0; }
    #sidebar .diag-row .val { color: #ffd966; font-family: monospace; }
    #controls { padding: 10px 24px; background: #16213e; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: relative; z-index: 1; }
    #controls button { padding: 6px 14px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 13px; cursor: pointer; }
    #controls button:hover { background: #0f3460; }
    #info-bar { padding: 6px 24px; background: #0f0f1a; font-size: 11px; color: #666; display: flex; gap: 24px; position: relative; z-index: 1; }
    #info-bar span { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="flashOverlay"></div>
  <div id="header">
    <h1>P0B.4 Warhead Impact Gallery — Multi-Effect Showcase</h1>
    <div class="subtitle">SpreadDamage | FireCluster | FlashEffect | ShakeScreen | Stacking</div>
  </div>
  <div id="controls">
    <button id="btnSpread">💥 Spread (AOE)</button>
    <button id="btnCluster">✨ Cluster</button>
    <button id="btnFlash">💡 Flash</button>
    <button id="btnShake">📳 Shake</button>
    <button id="btnAll">🔥 MASS DETONATION</button>
    <button id="btnReset">Reset</button>
  </div>
  <div id="layout">
    <div id="sandbox"><canvas id="renderCanvas"></canvas></div>
    <div id="sidebar">
      <h3>Effects</h3>
      <div class="diag-row"><span>Active</span><span class="val" id="diagActive">0</span></div>
      <div class="diag-row"><span>Flash</span><span class="val" id="diagFlash">0.00</span></div>
      <div class="diag-row"><span>Shake Amp</span><span class="val" id="diagShake">0.000</span></div>
      <div class="diag-row"><span>Impacts</span><span class="val" id="diagImpacts">0</span></div>
    </div>
  </div>
  <div id="info-bar">
    <span>UA: <span id="info-ua">-</span></span>
    <span>VP: <span id="info-viewport">-</span></span>
    <span>Engine: <span id="info-engine">-</span></span>
    <span>FPS: <span id="info-fps">-</span></span>
    <span>T: <span id="info-time">-</span></span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
