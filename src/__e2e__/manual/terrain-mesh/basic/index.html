<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terrain Mesh — Basic Visual Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
    #renderCanvas { width: 100vw; height: 100vh; display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 12px 16px; border-radius: 4px;
      font-size: 14px; line-height: 1.6;
      pointer-events: none; user-select: none;
    }
    #info h3 { margin: 0 0 8px; font-size: 16px; }
    #info code { background: rgba(255,255,255,0.15); padding: 1px 4px; border-radius: 2px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="info">
    <h3>Terrain Mesh — Basic Test</h3>
    <div>Left drag: rotate camera</div>
    <div>Right drag: pan</div>
    <div>Scroll: zoom</div>
    <div>Press <code>1</code> flat | <code>2</code> ramp | <code>3</code> isometric</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
