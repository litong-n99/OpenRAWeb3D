<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Layout — Nested Bounds | Acceptance Test</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui; background: #1a1a2e; color: #eee; }
    #header { padding: 14px 24px; background: #16213e; border-bottom: 1px solid #0f3460; }
    #header h1 { margin: 0; font-size: 19px; } #header .sub { color: #a0a0b0; font-size: 12px; margin-top: 3px; }
    #controls { padding: 10px 24px; background: #16213e; display: flex; gap: 10px; align-items: center; }
    #controls button { padding: 6px 14px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 13px; cursor: pointer; }
    #controls button:hover { background: #0f3460; }
    #controls select { padding: 4px 8px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 12px; }
    #sandbox { padding: 20px; min-height: 400px; background: #0a0a1a; position: relative; }
    .widget { position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.2); overflow: hidden; }
    .widget.level-0 { background: rgba(30,60,100,0.6); }
    .widget.level-1 { background: rgba(40,80,120,0.5); }
    .widget.level-2 { background: rgba(50,100,140,0.4); }
    .widget.level-3 { background: rgba(60,120,160,0.3); }
    .widget.level-4 { background: rgba(70,140,180,0.2); }
    .widget-label { position: absolute; top: 4px; left: 6px; font-size: 11px; color: #aac; pointer-events: none; }
    #info-bar { padding: 6px 24px; background: #0f0f1a; font-size: 11px; color: #666; display: flex; gap: 24px; }
    #sidebar { width: 260px; padding: 12px; position: fixed; right: 0; top: 100px; background: #16213e; font-size: 12px; border-left: 1px solid #0f3460; max-height: 60vh; overflow-y: auto; }
    #sidebar h3 { margin: 6px 0 3px; font-size: 12px; color: #7ec8e3; }
    #sidebar .r { display: flex; justify-content: space-between; padding: 1px 0; }
    #sidebar .r .v { color: #ffd966; font-family: monospace; }
  </style>
</head>
<body>
  <div id="header"><h1>P3A.1 Widget Layout — Nested Bounds & Z-Order</h1><div class="sub">Module: Widget + WidgetLoader | Parent-child hierarchy, margin/padding, alignment</div></div>
  <div id="controls">
    <button id="btnTree3">Tree Depth 3</button>
    <button id="btnTree5">Tree Depth 5</button>
    <button id="btnAlign" style="background:#0f3460">Align: Center</button>
    <button id="btnZOrder">Bring Child #2 to Top</button>
    <button id="btnReset">Reset</button>
  </div>
  <div id="sandbox"></div>
  <div id="sidebar">
    <h3>Widget Tree</h3><div id="diagTree"></div>
  </div>
  <div id="info-bar">
    <span>UA: <span id="info-ua">-</span></span><span>VP: <span id="info-viewport">-</span></span><span>T: <span id="info-time">-</span></span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
