<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua VM Integration (fengari) -- Scripting | 人工验收</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
    }
    #app { display: flex; height: 100vh; }
    #left-panel {
      width: 360px; min-width: 360px;
      background: #16213e; border-right: 1px solid #0f3460;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto;
    }
    #left-panel h2 { margin: 0; font-size: 15px; color: #8af; }
    #left-panel h3 { margin: 10px 0 4px; font-size: 12px; color: #a0b0d0; border-bottom: 1px solid #0f3460; padding-bottom: 3px; }
    #left-panel button {
      padding: 6px 10px; border-radius: 4px; border: 1px solid #0f3460;
      background: #1a1a2e; color: #eee; font-size: 12px; cursor: pointer;
      width: 100%; text-align: left;
    }
    #left-panel button:hover { background: #0f3460; }
    #left-panel button.runbtn { background: #00d4ff; color: #1a1a2e; font-weight: bold; text-align: center; }
    #left-panel button.runbtn:hover { background: #33ddff; }
    #right-panel {
      flex: 1; display: flex; flex-direction: column;
      padding: 16px; gap: 12px;
    }
    #luaInput {
      width: 100%; height: 220px;
      background: #0a0a1a; color: #00ff88;
      border: 1px solid #333; border-radius: 4px;
      padding: 10px; font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 13px; resize: vertical;
    }
    #output {
      flex: 1;
      background: #0a0a1a; color: #ccc;
      border: 1px solid #333; border-radius: 4px;
      padding: 10px; font-family: monospace; font-size: 12px;
      min-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }
    #output .error { color: #ff4444; }
    #output .success { color: #00ff88; }
    #output .info { color: #8888ff; }
    #status {
      font-size: 11px; padding: 6px 8px; border-radius: 4px;
      background: #0a0a1a; border: 1px solid #333;
    }
    #status.ok { color: #00ff88; border-color: #00ff88; }
    #status.fail { color: #ff4444; border-color: #ff4444; }
    #testResults { font-size: 12px; }
    .preset-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .preset-row button { width: auto; flex: 1; text-align: center; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="left-panel">
      <h2>Ch20: Lua VM (fengari)</h2>
      <div id="status">Initializing...</div>

      <h3>Quick Tests</h3>
      <div class="preset-row">
        <button id="preset-sandbox">Sandbox</button>
        <button id="preset-global">API Call</button>
        <button id="preset-callback">Callbacks</button>
      </div>
      <div class="preset-row">
        <button id="preset-error">Error</button>
        <button id="preset-print">Print</button>
      </div>

      <h3>Actions</h3>
      <button class="runbtn" id="runBtn">&#9654; Execute Lua</button>
      <button id="clearBtn">Clear Output</button>
      <button id="runAllBtn">Run All Automated Tests</button>

      <h3>Results</h3>
      <div id="testResults">Waiting for tests...</div>
    </div>
    <div id="right-panel">
      <textarea id="luaInput">-- Type Lua code here and click "Execute"
print("Hello from fengari Lua 5.3!")

-- Access the test global:
print("TestAPI.greet: " .. TestAPI.greet("World"))
print("TestAPI.add(3,4): " .. TestAPI.add(3, 4))
print("TestAPI.version: " .. TestAPI.version)</textarea>
      <div id="output"></div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
