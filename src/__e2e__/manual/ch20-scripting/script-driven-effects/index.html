<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Script-Driven Effects | Acceptance Test</title>
<style>
body{margin:0;font-family:'Segoe UI',system-ui;background:#1a1a2e;color:#eee}
#header{padding:14px 24px;background:#16213e;border-bottom:1px solid #0f3460}
#header h1{margin:0;font-size:19px}#header .sub{color:#a0a0b0;font-size:12px;margin-top:3px}
#layout{display:flex;height:calc(100vh - 148px)}
#sandbox{flex:1;position:relative}#sandbox canvas{display:block;width:100%;height:100%}
#sidebar{width:260px;padding:12px;background:#16213e;overflow-y:auto;font-size:12px;border-left:1px solid #0f3460}
#sidebar h3{margin:6px 0 3px;font-size:12px;color:#7ec8e3}
#sidebar .r{display:flex;justify-content:space-between;padding:1px 0}
#sidebar .r .v{color:#ffd966;font-family:monospace}
#controls{padding:10px 24px;background:#16213e;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#controls button{padding:6px 14px;border-radius:4px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:13px;cursor:pointer}
#controls button:hover{background:#0f3460}
#dialogue{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#ffd966;padding:8px 20px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
#info-bar{padding:6px 24px;background:#0f0f1a;font-size:11px;color:#666;display:flex;gap:24px}
</style></head><body>
<div id="header"><h1>P3D.1 Script-Driven Effects</h1><div class="sub">Module: Lua Scripting API (Ch20) | Camera, Animation, Dialogue, Timed Sequences</div></div>
<div id="controls">
<button id="btnCamera">Camera Move</button>
<button id="btnAnim">Actor Animation</button>
<button id="btnDialogue">Dialogue</button>
<button id="btnSequence">Timed Sequence</button>
<button id="btnReset">Reset</button>
</div>
<div id="layout">
<div id="sandbox"><canvas id="renderCanvas"></canvas><div id="dialogue"></div></div>
<div id="sidebar">
<h3>Script Status</h3><div class="r"><span>Running</span><span class="v" id="dRunning">idle</span></div><div class="r"><span>Step</span><span class="v" id="dStep">-</span></div>
<h3>Camera</h3><div class="r"><span>Target</span><span class="v" id="dCam">-</span></div>
<h3>Actor</h3><div class="r"><span>Animation</span><span class="v" id="dAnim">idle</span></div><div class="r"><span>Color</span><span class="v" id="dColor">-</span></div>
<h3>Events</h3><div class="r"><span>Count</span><span class="v" id="dEvents">0</span></div>
</div>
</div>
<div id="info-bar"><span>UA:<span id="info-ua">-</span></span><span>VP:<span id="info-viewport">-</span></span><span>Engine:<span id="info-engine">-</span></span><span>FPS:<span id="info-fps">-</span></span><span>T:<span id="info-time">-</span></span></div>
<script type="module" src="./main.ts"></script>
</body></html>
