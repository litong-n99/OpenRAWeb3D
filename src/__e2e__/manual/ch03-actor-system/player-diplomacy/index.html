<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - 外交颜色可视化 | 人工验收</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui; background: #1a1a2e; color: #eee; }
    #header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; }
    #header h1 { margin: 0; font-size: 20px; }
    #header .subtitle { color: #a0a0b0; font-size: 13px; margin-top: 4px; }
    #layout { display: flex; height: calc(100vh - 180px); }
    #canvas-panel { flex: 1; position: relative; min-width: 0; }
    #canvas-panel canvas { display: block; outline: none !important; touch-action: none; }
    #color-panel { width: 380px; background: #0f1420; border-left: 1px solid #0f3460; overflow-y: auto; padding: 16px; }
    #color-panel h3 { font-size: 14px; color: #8b949e; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px; }
    .color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 8px 10px; border-radius: 6px; background: #161b22; }
    .color-row.self { border-left: 3px solid #00ff00; }
    .color-row.ally { border-left: 3px solid #ffff00; }
    .color-row.neutral { border-left: 3px solid #ffffff; }
    .color-row.enemy { border-left: 3px solid #ff0000; }
    .swatch { width: 40px; height: 40px; border-radius: 4px; border: 1px solid #30363d; flex-shrink: 0; }
    .color-meta { flex: 1; min-width: 0; }
    .color-meta .name { font-size: 13px; font-weight: 600; }
    .color-meta .argb { font-size: 11px; color: #8b949e; font-family: 'Consolas', 'Fira Code', monospace; }
    .color-meta .desc { font-size: 11px; color: #58a6ff; margin-top: 2px; }
    #relationship-grid { margin-top: 16px; }
    #relationship-grid h3 { margin-bottom: 8px; }
    .rel-grid { display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 2px; font-size: 12px; }
    .rel-grid .cell { padding: 6px 8px; text-align: center; border-radius: 3px; }
    .rel-grid .header { color: #8b949e; font-weight: 600; }
    .rel-grid .row-hdr { text-align: right; color: #a0a0b0; padding-right: 10px; }
    .rel-ally { background: #1a3a1a; color: #4ade80; }
    .rel-neutral { background: #1a1a2e; color: #a0a0b0; }
    .rel-enemy { background: #3a1a1a; color: #f87171; }
    #info-bar { padding: 8px 24px; background: #0f0f1a; font-size: 11px; color: #666; display: flex; gap: 24px; flex-wrap: wrap; }
    #info-bar span { white-space: nowrap; }
    #controls { padding: 8px 16px; background: #16213e; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #0f3460; }
    #controls button, #controls select { padding: 5px 10px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 12px; cursor: pointer; }
    #controls button:hover { background: #0f3460; }
    #controls label { font-size: 12px; color: #8b949e; }
    #gpu-error { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; background: rgba(255,0,0,0.08); color: #ff6b6b; font-size: 18px; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Player System - 玩家颜色与外交关系可视化</h1>
    <div class="subtitle">ID: player/player-diplomacy | 期望结果见 README.md</div>
  </div>
  <div id="controls">
    <button id="btn-cycle-viewer">切换观察者视角</button>
    <label>观察者: <span id="viewer-label" style="color:#58a6ff;">Player A</span></label>
    <span style="margin-left:8px;color:#484f58;">|</span>
    <label>
      <input type="checkbox" id="chk-stance-colors" checked>
      启用关系颜色 (PlayerRelationshipColor)
    </label>
    <span style="margin-left:8px;color:#484f58;">|</span>
    <button id="btn-random-relations">随机外交关系</button>
    <button id="btn-reset">重置</button>
  </div>
  <div id="layout">
    <div id="canvas-panel">
      <div id="gpu-error">WebGL 不可用 — 请检查浏览器支持</div>
    </div>
    <div id="color-panel">
      <h3>Player 颜色对照 (ARGB)</h3>
      <div id="color-rows"></div>
      <div id="relationship-grid">
        <h3>外交关系矩阵</h3>
        <div class="rel-grid" id="rel-grid"></div>
      </div>
    </div>
  </div>
  <div id="info-bar">
    <span>UA: <span id="info-ua">-</span></span>
    <span>视口: <span id="info-viewport">-</span></span>
    <span>引擎: <span id="info-engine">-</span></span>
    <span>FPS: <span id="info-fps">-</span></span>
    <span>时间: <span id="info-time">-</span></span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
